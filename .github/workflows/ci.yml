name: CI

# Every branch push runs CI, so a branch can be checked before it is merged straight into main.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_VERSION: "2.3.4"

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install poetry
        run: python -m pip install "poetry==${POETRY_VERSION}"
      - name: Install dependencies
        run: |
          poetry env use python
          poetry install --no-interaction
      - name: Tests
        run: poetry run pytest -q
      - name: Lint
        run: poetry run ruff check .
      - name: Format
        run: poetry run ruff format --check .

  systemd:
    name: systemd units
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render the templates
        run: |
          stub="$RUNNER_TEMP/model-server"
          mkdir -p "$stub/models"
          printf '#!/bin/sh\nexit 0\n' > "$stub/serve"
          chmod +x "$stub/serve"
          BACKEND_DIR="$stub" deploy/render-units.sh "$RUNNER_TEMP/units"
      - name: Verify the rendered units
        run: systemd-analyze verify "$RUNNER_TEMP/units/decisions-gateway.service" "$RUNNER_TEMP/units/backend.service"
      - name: Security exposure
        run: |
          for unit in decisions-gateway backend; do
            systemd-analyze security --offline=yes "$RUNNER_TEMP/units/$unit.service" | tail -1
          done

  launchd:
    name: launchd agents
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Render the templates
        run: |
          stub="$RUNNER_TEMP/model-server"
          mkdir -p "$stub/models"
          PYTHON="$(command -v python3)" BACKEND_DIR="$stub" deploy/render-launchd.sh "$RUNNER_TEMP/agents"
      - name: Lint the rendered agents
        run: plutil -lint "$RUNNER_TEMP/agents/decisions-gateway.plist" "$RUNNER_TEMP/agents/backend.plist"
